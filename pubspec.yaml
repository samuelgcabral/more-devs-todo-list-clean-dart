name: todo_gabarito
description: Gabarito da aula de arquitetura em camadas com Clean Dart (Presenter, Domain, Infra, External).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2

# O objective_c (só iOS/macOS) traz um hook de build que faz o flutter test
# falhar no Windows quando o caminho do SDK tem espaço. Esta versão não depende
# dele. Pode sair quando o Flutter corrigir o hooks_runner.
dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
